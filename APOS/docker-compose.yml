services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: cos
      POSTGRES_PASSWORD: cos
      POSTGRES_DB: cos
    ports:
      - "5432:5432"
    volumes:
      - cos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - cos_qdrant:/qdrant/storage

volumes:
  cos_pg:
  cos_qdrant:
